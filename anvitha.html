<!DOCTYPE html>
<html lang="en">
<head>
    <title>Meal Schedule</title>
</head>
<body>

    <table border="1">
        <tr>
            <th>Day</th>
            <th>Meal</th>
            <th>Food</th>
        </tr>

        <tr>
            <th rowspan="2">Monday</th>
            <td>Breakfast</td>
            <td>Oatmeal</td>
        </tr>

        <tr>
            <td>Lunch</td>
            <td>Pasta</td>
        </tr>

        <tr>
            <th rowspan="2">Tuesday</th>
            <td>Breakfast</td>
            <td>Pancakes</td>
        </tr>

        <tr>
            <td>Lunch</td>
            <td>Sandwich</td>
        </tr>
    </table>

</body>
</html>
